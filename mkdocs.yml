site_name: GitHub Monitor
site_description: System tray monitor for open pull requests and unanswered issues on GitHub.
site_author: Arrase
site_url: https://arrase.github.io/github-monitor/
docs_dir: gh-pages

repo_name: arrase/github-monitor
repo_url: https://github.com/arrase/github-monitor

nav:
  - Overview: index.md
  - Architecture & Design: architecture.md
  - Attention Rules: detection.md
  - Tray Icon & Notifications: tray.md
  - Configuration: configuration.md
  - Localization: localization.md
  - Installation & Setup: installation.md
  - Development: development.md

theme:
  name: material
  language: en
  icon:
    logo: fontawesome/brands/github
  palette:
    # Palette toggle for light/dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.sections
    - content.code.copy

plugins: []

extra_css:
  - https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css
  - stylesheets/extra.css

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/arrase/github-monitor
