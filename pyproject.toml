[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "github-monitor"
version = "1.0.1"
description = "System tray monitor for open pull requests and unanswered issues on GitHub"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "PyQt6>=6.11.0",
    "requests>=2.34.2",
]

[project.optional-dependencies]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "Babel>=2.18.0",
]
dev = [
    "github-monitor[test]",
    "ruff==0.17.2",
    "mypy>=2.4.0",
]

[project.scripts]
github-monitor = "github_monitor.__main__:main"

[tool.setuptools.package-data]
github_monitor = ["locale/*/LC_MESSAGES/*.mo", "assets/*"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "A", "B", "C4", "S", "UP", "SIM", "RUF", "PTH", "PIE",
    "RET", "PERF", "ASYNC", "LOG", "G", "T20", "PL",
]
ignore = [
    # Design-metric rules: thresholds are arbitrary and would force artificial splits.
    "PLR0911", "PLR0913", "PLR0915", "PLR0917", "PLR2004",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["github_monitor"]
relative_files = true

[tool.coverage.report]
show_missing = true

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
show_error_codes = true
show_column_numbers = true

# PyQt6 stubs type non-null Qt C++ pointers (QMenu, QAction, QStyleHints) as Optional.
[[tool.mypy.overrides]]
module = "github_monitor.tray"
disable_error_code = ["union-attr"]
